services:
  # Backend API (Web Service)
  - type: web
    name: ai-support-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Frontend (Static Site)
  - type: web
    name: ai-support-agent-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://ai-support-agent-backend.onrender.com/api/*
      - type: rewrite
        source: /static/*
        destination: https://ai-support-agent-backend.onrender.com/static/*
      - type: rewrite
        source: /*
        destination: /index.html
